name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          SM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null
          "$SM" "platforms;android-35" "build-tools;35.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
      - name: Turbo cache outside the checkout
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-DesignSystem" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run ci
