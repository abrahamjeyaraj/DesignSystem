name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0), for re-running a release"
        required: true
permissions:
  packages: write
  contents: read
# A tag pushed twice must not publish twice: GitHub Packages rejects an existing version with 409.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    # Mac mini self-hosted runner (runner.sh install DesignSystem): bun, JDK 17, Android SDK and
    # Xcode come from the machine. Linux runners are only for builds that need Linux.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
      - name: Turbo cache outside the checkout
        run: echo "TURBO_CACHE_DIR=$HOME/.cache/turbo/DesignSystem" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Set release version
        # npm version cannot parse "workspace:*" deps, so set the field directly.
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"; VERSION="${VERSION#v}"
          echo "DS_VERSION=$VERSION" >> "$GITHUB_ENV"
          for p in tokens ui-web ui-native; do
            DS_VERSION="$VERSION" bun -e 'const f = "packages/" + process.argv[1] + "/package.json"; const j = await Bun.file(f).json(); j.version = process.env.DS_VERSION; await Bun.write(f, JSON.stringify(j, null, 2) + "\n");' "$p"
          done
      - name: Configure npm authentication
        # Checkout-local and expanded by bun at publish time: the shared machine never stores the
        # token, and homegenie's ~/.npmrc is left alone.
        run: printf '@abrahamjeyaraj:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
      # Every platform must pass before anything publishes, Swift and Flutter included.
      - run: bun run ci
      # npm packages (bun publish rewrites "workspace:*") and the Android AAR (Gradle to Maven).
      # Swift and Flutter release as this git tag; the root script filters them out of the graph.
      - run: bun run release
