name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0), for re-running a release"
        required: true
permissions:
  packages: write
  contents: read
# A tag pushed twice must not publish twice: GitHub Packages rejects an existing version with 409.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
      - name: Turbo cache outside the checkout
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-DesignSystem" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Set release version
        # Also refreshes bun.lock (bun publish reads workspace versions from it) and fails if any
        # packed @abrahamjeyaraj/* dependency disagrees with the release version.
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"; VERSION="${VERSION#v}"
          echo "DS_VERSION=$VERSION" >> "$GITHUB_ENV"
          bun scripts/set-version.ts "$VERSION"
      - name: Configure npm authentication
        # Checkout-local and expanded by bun at publish time: the shared machine never stores the
        # token, and homegenie's ~/.npmrc is left alone.
        run: printf '@abrahamjeyaraj:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
      # Every platform must pass before anything publishes, Swift and Flutter included.
      - run: bun run ci
      # npm packages (bun publish rewrites "workspace:*") and the Android AAR (Gradle to Maven).
      # Swift and Flutter release as this git tag; the root script filters them out of the graph.
      - run: bun run release
