name: Publish npm packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0), for re-running a release"
        required: true
permissions:
  packages: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Set package versions
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"; VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --workspace=@abrahamjeyaraj/tokens
          npm version "$VERSION" --no-git-tag-version --allow-same-version --workspace=@abrahamjeyaraj/ui-web
          npm version "$VERSION" --no-git-tag-version --allow-same-version --workspace=@abrahamjeyaraj/ui-native
      - run: bun run verify
      - run: bun run build
      - name: Configure npm authentication
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # bun publish (not npm) rewrites "workspace:*" dependencies to the released version.
      - run: bun publish
        working-directory: packages/tokens
      - run: bun publish
        working-directory: packages/ui-web
      - run: bun publish
        working-directory: packages/ui-native
