name: Publish npm packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0), for re-running a release"
        required: true
permissions:
  packages: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Set package versions
        # npm version cannot parse "workspace:*" deps, so set the field directly.
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"; export VERSION="${VERSION#v}"
          for p in tokens ui-web ui-native; do
            bun -e 'const f = "packages/" + process.argv[1] + "/package.json"; const j = await Bun.file(f).json(); j.version = process.env.VERSION; await Bun.write(f, JSON.stringify(j, null, 2) + "\n");' "$p"
          done
      - run: bun run verify
      - run: bun run build
      - name: Configure npm authentication
        run: printf '@abrahamjeyaraj:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # bun publish (not npm) rewrites "workspace:*" dependencies to the released version.
      # --registry is explicit: bun publish ignores publishConfig and would default to npmjs.org.
      - run: bun publish --registry https://npm.pkg.github.com
        working-directory: packages/tokens
      - run: bun publish --registry https://npm.pkg.github.com
        working-directory: packages/ui-web
      - run: bun publish --registry https://npm.pkg.github.com
        working-directory: packages/ui-native
